name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["reports/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - name: Configuration is valid
        run: uv run research-agent init --help >/dev/null && uv run python -c "from research_agent.settings import load_settings; load_settings('.')"
      - name: Offline test suite (no network, no credentials)
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.org
          uv run pytest -q
