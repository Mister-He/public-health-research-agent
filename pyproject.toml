[project]
name = "research-agent"
version = "0.1.0"
description = "Autonomous public health research intelligence agent: literature monitoring, scoring, trend tracking and verified daily digests."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Yichen He" }]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
research-agent = "research_agent.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra -m 'not live'"
markers = [
    "live: hits real external APIs (run explicitly with -m live)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
